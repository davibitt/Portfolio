<!DOCTYPE html>
<html lang="en" class="no-js">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Contact — Davi Bittencourt</title>
  <meta name="description" content="Get in touch with Davi Bittencourt." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&family=Inter:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script>document.documentElement.classList.replace("no-js","js")</script>
</head>
<body data-page="contact">

  <div class="fog" aria-hidden="true"><canvas id="fluid"></canvas></div>

  <header class="site-header" data-header></header>

  <main id="page">
    <section class="page-hero">
      <div class="wrap">
        <span class="section-index reveal">(contact)</span>
        <h1 class="page-title reveal">Let's talk.</h1>
        <p class="page-intro reveal">Tell me about your brand and what you're looking for. I'll get back to you with the next steps.</p>
      </div>
    </section>

    <!-- a lista abaixo vem de js/site-config.js -->
    <section class="contact-page">
      <div class="wrap">
        <div class="contact-list" data-contact-list></div>
        <p class="contact-note reveal" data-contact-location></p>
      </div>
    </section>
  </main>

  <footer class="site-footer" data-footer></footer>

  <script src="js/site-config.js"></script>
  <script src="js/projects.js"></script>
  <script src="js/fluid.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
